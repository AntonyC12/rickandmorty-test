<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="detail-container" id="detailContent">
        </div>
    
    <script>
        async function loadDetail() {
            // Obtener el ID de la URL
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            
            if (!id) return;

            const response = await fetch(`https://rickandmortyapi.com/api/character/${id}`);
            const char = await response.json();
            
            const container = document.getElementById('detailContent');
            container.innerHTML = `
                <div style="display:flex; flex-direction:column;">
                    <img src="${char.image}" alt="${char.name}">
                    <button class="back-btn" onclick="window.location.href='dashboard.html'">Volver al Dashboard</button>
                </div>
                <div class="info">
                    <h2>${char.name}</h2>
                    <p><strong>Estado:</strong> ${char.status}</p>
                    <p><strong>Especie:</strong> ${char.species}</p>
                    <p><strong>Género:</strong> ${char.gender}</p>
                    <p><strong>Origen:</strong> ${char.origin.name}</p>
                </div>
            `;
        }
        loadDetail();
    </script>
</body>
</html>
